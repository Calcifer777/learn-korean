[project]
name = "learn-korean"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "deep-translator>=1.11.4",
  "elevenlabs>=2.36.1",
  "genanki>=0.13.1",
  "google-genai>=1.66.0",
  "kiwipiepy>=0.22.2",
  "numpy>=2.4.2",
  "pandas>=3.0.1",
  "playsound3>=3.3.1",
  "python-dotenv>=1.2.1",
  "stable-ts[fw]>=2.19.1",
  "tqdm>=4.67.1",
]

[project.scripts]
learn-korean = "learn_korean.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]
